<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Ore & Straordinari</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --weekend-bg: rgba(56, 189, 248, 0.08);
            --day-bg: #0f172a;
            --tab-active-bg: #1e293b;
            --tab-inactive-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            width: 100%;
            max-width: 1150px;
            border: 1px solid var(--border-color);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* BARRA DEI TAB IN STILE EXCEL */
        .tabs-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0;
            margin-bottom: 20px;
        }

        .tabs-bar::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-bar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .tab-btn {
            background-color: var(--tab-inactive-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 10px 16px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background-color: var(--tab-active-bg);
            color: var(--accent-color);
            border-color: var(--accent-color);
            border-bottom: 2px solid var(--tab-active-bg);
            margin-bottom: -2px;
        }

        /* CONTENUTO TAB */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* FORM CONFIGURAZIONE MASTER */
        .master-panel {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        /* GRIGLIA CALENDARIO A QUADRETTI */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .btn-small {
            background-color: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-small:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .calendar-day {
            background: var(--day-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            min-height: 105px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
        }

        .calendar-day.weekend {
            background: var(--weekend-bg);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .day-num {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            align-self: flex-start;
            margin-bottom: 2px;
        }

        .calendar-day.weekend .day-num {
            color: var(--accent-color);
        }

        .day-inputs-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .input-row label {
            font-size: 0.68rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .input-row input {
            width: 48px;
            text-align: center;
            padding: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
        }

        .day-tag {
            font-size: 0.68rem;
            font-weight: 600;
            text-align: center;
            margin-top: 2px;
        }

        /* SUMMARY BOX */
        .summary-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 5px;
            margin-bottom: 0;
        }

        @media (max-width: 850px) {
            .calendar-grid, .calendar-weekdays {
                grid-template-columns: repeat(7, minmax(45px, 1fr));
            }
            .calendar-day {
                padding: 4px 2px;
                min-height: 95px;
            }
            .input-row input {
                width: 38px;
                font-size: 0.75rem;
            }
            .input-row label {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>Calcolatore Ore & Straordinari</h1>
        <div class="input-group" style="flex-direction: row; align-items: center; gap: 8px;">
            <label for="yearSelect">Anno:</label>
            <select id="yearSelect" onchange="buildYearGrid()"></select>
        </div>
    </div>

    <!-- TAB BAR IN STILE EXCEL -->
    <div class="tabs-bar" id="tabsBar">
        <button class="tab-btn active" onclick="switchTab('master')">⚙️ Master</button>
        <!-- Generati da JS per i 12 Mesi -->
        <button class="tab-btn" onclick="switchTab('annual')">📊 Totale Annuo</button>
    </div>

    <!-- CONTENUTO TAB MASTER -->
    <div class="tab-content active" id="tab-master">
        <div class="master-panel">
            <h2 style="font-size: 1.1rem; color: var(--accent-color); margin-bottom: 15px;">Impostazioni Globali & Tariffe</h2>
            <div class="grid-config">
                <div class="input-group">
                    <label for="monthlySalary">Stipendio Base Mensile (€)</label>
                    <input type="number" id="monthlySalary" value="1800" step="10" oninput="calculateAll()">
                </div>
                <div class="input-group">
                    <label for="standardHours">Ore Std / Giorno</label>
                    <input type="number" id="standardHours" value="8" step="0.5" oninput="calculateAll()">
                </div>
                <div class="input-group">
                    <label for="weekdayOvertimeRate">Extra Feriale (€/h)</label>
                    <input type="number" id="weekdayOvertimeRate" value="15.60" step="0.5" oninput="calculateAll()">
                </div>
                <div class="input-group">
                    <label for="weekendOvertimeRate">Extra Festivo / Sab / Dom (€/h)</label>
                    <input type="number" id="weekendOvertimeRate" value="18.00" step="0.5" oninput="calculateAll()">
                </div>
                <div class="input-group">
                    <label for="forfaitThreshold">Forfait Mensile (Soglia Ore)</label>
                    <input type="number" id="forfaitThreshold" value="20" step="1" oninput="calculateAll()">
                </div>
            </div>
        </div>
    </div>

    <!-- TAB MESI (Inseriti dinamicamente via JS) -->
    <div id="monthsTabContainer"></div>

    <!-- CONTENUTO TAB TOTALE ANNUALE -->
    <div class="tab-content" id="tab-annual">
        <div class="summary-box">
            <h2 style="font-size: 1.1rem; color: var(--accent-color); margin-bottom: 15px;">Bilancio Complessivo Anno</h2>
            <div class="summary-row">
                <span>Totale Ore Ordinarie Annue:</span>
                <span id="yearStdHours">0 h</span>
            </div>
            <div class="summary-row">
                <span>Totale Ore Extra Inserite:</span>
                <span id="yearExtHours" style="color: var(--warning-color);">0 h</span>
            </div>
            <div class="summary-row">
                <span>Ore Extra Pagate Oltre Forfait:</span>
                <span id="yearPaidExtHours" style="color: var(--danger-color);">0 h</span>
            </div>
            <div class="summary-row">
                <span>Stipendio Base Annuo:</span>
                <span id="yearBasePay">0.00 €</span>
            </div>
            <div class="summary-row">
                <span>Compenso Straordinari Pagati Annuo:</span>
                <span id="yearExtPay" style="color: var(--success-color);">+0.00 €</span>
            </div>
            <div class="summary-row total">
                <span>Totale Guadagno Annuo:</span>
                <span id="yearGrandTotal">0.00 €</span>
            </div>
        </div>
    </div>
</div>

<script>
    const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
    const monthShortNames = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
    const weekDaysShort = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];

    const yearSelect = document.getElementById('yearSelect');

    function initYearSelector() {
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 2; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }
    }

    function initTabs() {
        const tabsBar = document.getElementById('tabsBar');
        const annualBtn = tabsBar.lastElementChild;

        monthShortNames.forEach((mShort, mIndex) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.id = `btn-tab-${mIndex}`;
            btn.innerText = mShort;
            btn.onclick = () => switchTab(mIndex);
            tabsBar.insertBefore(btn, annualBtn);
        });
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabId === 'master') {
            document.querySelector('.tab-btn:first-child').classList.add('active');
            document.getElementById('tab-master').classList.add('active');
        } else if (tabId === 'annual') {
            document.querySelector('.tab-btn:last-child').classList.add('active');
            document.getElementById('tab-annual').classList.add('active');
        } else {
            document.getElementById(`btn-tab-${tabId}`).classList.add('active');
            document.getElementById(`tab-month-${tabId}`).classList.add('active');
        }
    }

    function buildYearGrid() {
        const year = parseInt(yearSelect.value);
        const container = document.getElementById('monthsTabContainer');
        container.innerHTML = '';

        monthNames.forEach((mName, mIndex) => {
            const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
            let firstDayOfWeek = new Date(year, mIndex, 1).getDay();
            firstDayOfWeek = (firstDayOfWeek === 0) ? 6 : firstDayOfWeek - 1;

            const savedData = loadSavedData(year, mIndex);

            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab-content';
            tabDiv.id = `tab-month-${mIndex}`;

            let calendarHTML = `<div class="calendar-weekdays">`;
            weekDaysShort.forEach(d => calendarHTML += `<div>${d}</div>`);
            calendarHTML += `</div><div class="calendar-grid">`;

            for (let e = 0; e < firstDayOfWeek; e++) {
                calendarHTML += `<div class="calendar-day empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, mIndex, d);
                const dayOfWeek = dateObj.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                
                const daySaved = savedData[d] || {};
                const savedOrd = daySaved.ord !== undefined ? daySaved.ord : '';
                const savedExt = daySaved.ext !== undefined ? daySaved.ext : '';

                calendarHTML += `
                    <div class="calendar-day ${isWeekend ? 'weekend' : ''}">
                        <span class="day-num">${d}</span>
                        <div class="day-inputs-container">
                            <div class="input-row">
                                <label for="m-${mIndex}-d-${d}-ord">Ord:</label>
                                <input type="number" id="m-${mIndex}-d-${d}-ord" value="${savedOrd}" min="0" max="24" step="0.5" oninput="calculateAll()">
                            </div>
                            <div class="input-row">
                                <label for="m-${mIndex}-d-${d}-ext">Extra:</label>
                                <input type="number" id="m-${mIndex}-d-${d}-ext" value="${savedExt}" min="0" max="24" step="0.5" oninput="calculateAll()">
                            </div>
                        </div>
                        <span class="day-tag" id="tag-m${mIndex}-d${d}">-</span>
                    </div>
                `;
            }

            calendarHTML += `</div>`;

            tabDiv.innerHTML = `
                <div class="actions-bar">
                    <h2 style="font-size: 1.2rem; color: var(--accent-color);">${mName} ${year}</h2>
                    <div>
                        <button class="btn-small" onclick="fillMonthWorkdays(${mIndex})">Compila Lun-Ven (Ord)</button>
                        <button class="btn-small" onclick="clearMonth(${mIndex})">Azzera Mese</button>
                    </div>
                </div>

                ${calendarHTML}

                <div class="summary-box">
                    <div class="summary-row">
                        <span>Ore Ordinarie Totali:</span>
                        <span id="summary-std-${mIndex}">0 h</span>
                    </div>
                    <div class="summary-row">
                        <span>Ore Extra Inserite:</span>
                        <span id="summary-ext-${mIndex}" style="color: var(--warning-color);">0 h</span>
                    </div>
                    <div class="summary-row">
                        <span>Ore Extra Pagate (> Forfait):</span>
                        <span id="summary-paid-ext-${mIndex}" style="color: var(--danger-color);">0 h</span>
                    </div>
                    <div class="summary-row">
                        <span>Stipendio Base Fisso:</span>
                        <span id="summary-base-pay-${mIndex}">0.00 €</span>
                    </div>
                    <div class="summary-row">
                        <span>Compenso Extra Pagato:</span>
                        <span id="summary-ext-pay-${mIndex}" style="color: var(--success-color);">+0.00 €</span>
                    </div>
                    <div class="summary-row total">
                        <span>Totale Guadagno Mese:</span>
                        <span id="summary-total-${mIndex}">0.00 €</span>
                    </div>
                </div>
            `;

            container.appendChild(tabDiv);
        });

        calculateAll();
    }

    function calculateAll() {
        const year = parseInt(yearSelect.value);
        const monthlySalary = parseFloat(document.getElementById('monthlySalary').value) || 0;
        const weekdayOvertimeRate = parseFloat(document.getElementById('weekdayOvertimeRate').value) || 0;
        const weekendOvertimeRate = parseFloat(document.getElementById('weekendOvertimeRate').value) || 0;
        const forfaitThreshold = parseFloat(document.getElementById('forfaitThreshold').value) || 0;

        let yearStdHrs = 0;
        let yearExtHrs = 0;
        let yearPaidExtHrs = 0;
        let yearBasePay = 0;
        let yearExtPay = 0;

        monthNames.forEach((_, mIndex) => {
            const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
            let monthStdHrs = 0;
            let monthExtHrs = 0;
            const monthState = {};

            const overtimeEntries = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const inputOrd = document.getElementById(`m-${mIndex}-d-${d}-ord`);
                const inputExt = document.getElementById(`m-${mIndex}-d-${d}-ext`);
                if (!inputOrd || !inputExt) continue;

                const ordHours = parseFloat(inputOrd.value) || 0;
                const extHours = parseFloat(inputExt.value) || 0;

                monthState[d] = { ord: inputOrd.value, ext: inputExt.value };

                monthStdHrs += ordHours;

                const dateObj = new Date(year, mIndex, d);
                const dayOfWeek = dateObj.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                if (extHours > 0) {
                    monthExtHrs += extHours;
                    overtimeEntries.push({
                        day: d,
                        hours: extHours,
                        isWeekend: isWeekend
                    });
                } else {
                    updateDayTag(mIndex, d, ordHours > 0 ? "OK" : "-", "var(--text-muted)");
                }
            }

            let accumulatedOvertime = 0;
            let monthPaidExtPay = 0;
            let monthPaidExtHrs = 0;

            overtimeEntries.forEach(entry => {
                let paidHoursInThisEntry = 0;

                for (let h = 0; h < entry.hours; h += 0.5) {
                    accumulatedOvertime += 0.5;
                    if (accumulatedOvertime > forfaitThreshold) {
                        paidHoursInThisEntry += 0.5;
                    }
                }

                monthPaidExtHrs += paidHoursInThisEntry;
                const rate = entry.isWeekend ? weekendOvertimeRate : weekdayOvertimeRate;
                monthPaidExtPay += (paidHoursInThisEntry * rate);

                if (paidHoursInThisEntry > 0) {
                    updateDayTag(mIndex, entry.day, `+${entry.hours}h (€)`, "var(--danger-color)");
                } else {
                    updateDayTag(mIndex, entry.day, `+${entry.hours}h (Forfait)`, "var(--warning-color)");
                }
            });

            // Lo stipendio base è fisso (oppure 0 se non ci sono né ore ordinarie né straordinari nel mese)
            const monthBasePay = (monthStdHrs > 0 || monthExtHrs > 0) ? monthlySalary : 0;
            const monthTotalPay = monthBasePay + monthPaidExtPay;

            // Aggiorna Riepilogo Mese
            document.getElementById(`summary-std-${mIndex}`).innerText = `${monthStdHrs.toFixed(1)} h`;
            document.getElementById(`summary-ext-${mIndex}`).innerText = `${monthExtHrs.toFixed(1)} h`;
            document.getElementById(`summary-paid-ext-${mIndex}`).innerText = `${monthPaidExtHrs.toFixed(1)} h`;
            document.getElementById(`summary-base-pay-${mIndex}`).innerText = `${monthBasePay.toFixed(2)} €`;
            document.getElementById(`summary-ext-pay-${mIndex}`).innerText = `+${monthPaidExtPay.toFixed(2)} €`;
            document.getElementById(`summary-total-${mIndex}`).innerText = `${monthTotalPay.toFixed(2)} €`;

            yearStdHrs += monthStdHrs;
            yearExtHrs += monthExtHrs;
            yearPaidExtHrs += monthPaidExtHrs;
            yearBasePay += monthBasePay;
            yearExtPay += monthPaidExtPay;

            saveData(year, mIndex, monthState);
        });

        const yearGrandTotal = yearBasePay + yearExtPay;

        // Aggiorna Tab Totale Annuo
        document.getElementById('yearStdHours').innerText = `${yearStdHrs.toFixed(1)} h`;
        document.getElementById('yearExtHours').innerText = `${yearExtHrs.toFixed(1)} h`;
        document.getElementById('yearPaidExtHours').innerText = `${yearPaidExtHrs.toFixed(1)} h`;
        document.getElementById('yearBasePay').innerText = `${yearBasePay.toFixed(2)} €`;
        document.getElementById('yearExtPay').innerText = `+${yearExtPay.toFixed(2)} €`;
        document.getElementById('yearGrandTotal').innerText = `${yearGrandTotal.toFixed(2)} €`;
    }

    function updateDayTag(mIndex, day, text, color) {
        const tag = document.getElementById(`tag-m${mIndex}-d${day}`);
        if (tag) {
            tag.innerText = text;
            tag.style.color = color;
        }
    }

    function fillMonthWorkdays(mIndex) {
        const year = parseInt(yearSelect.value);
        const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
        const stdHours = document.getElementById('standardHours').value || 8;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, mIndex, d);
            const dayOfWeek = dateObj.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                const inputOrd = document.getElementById(`m-${mIndex}-d-${d}-ord`);
                if (inputOrd) inputOrd.value = stdHours;
            }
        }
        calculateAll();
    }

    function clearMonth(mIndex) {
        const year = parseInt(yearSelect.value);
        const daysInMonth = new Date(year, mIndex + 1, 0).getDate();

        for (let d = 1; d <= daysInMonth; d++) {
            const inputOrd = document.getElementById(`m-${mIndex}-d-${d}-ord`);
            const inputExt = document.getElementById(`m-${mIndex}-d-${d}-ext`);
            if (inputOrd) inputOrd.value = '';
            if (inputExt) inputExt.value = '';
        }
        calculateAll();
    }

    function saveData(year, month, data) {
        const key = `work_hours_${year}_${month}`;
        localStorage.setItem(key, JSON.stringify(data));
    }

    function loadSavedData(year, month) {
        const key = `work_hours_${year}_${month}`;
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : {};
    }

    initYearSelector();
    initTabs();
    buildYearGrid();
</script>

</body>
</html>
