<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Lavoro & Straordinari</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --weekend-bg: rgba(56, 189, 248, 0.08);
            --day-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 25px;
            width: 100%;
            max-width: 1100px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Master Panel Impostazioni */
        .master-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .master-panel h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            background-color: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-small:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Struttura Mesi */
        .year-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
        }

        .month-card {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            user-select: none;
        }

        .month-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .month-title {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .month-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .month-body {
            display: none;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .month-card.open .month-body {
            display: block;
        }

        /* Griglia Calendario a Quadrettoni */
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .calendar-day {
            background: var(--day-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 6px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
        }

        .calendar-day.weekend {
            background: var(--weekend-bg);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .day-num {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            align-self: flex-start;
        }

        .calendar-day.weekend .day-num {
            color: var(--accent-color);
        }

        .day-input-box {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .day-input-box input {
            width: 55px;
            text-align: center;
            padding: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .day-tag {
            font-size: 0.68rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        /* Box Summary Totali */
        .summary-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 5px;
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .calendar-grid, .calendar-weekdays {
                grid-template-columns: repeat(7, minmax(40px, 1fr));
            }
            .calendar-day {
                padding: 4px 2px;
                min-height: 70px;
            }
            .day-input-box input {
                width: 42px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calendario Ore & Straordinari</h1>

    <!-- PANNELLO MASTER IMPOSTAZIONI GLOBAL -->
    <div class="master-panel">
        <h2>Pannello Master - Regole & Tariffe</h2>
        <div class="grid-config">
            <div class="input-group">
                <label for="yearSelect">Anno Selezionato</label>
                <select id="yearSelect" onchange="buildYearGrid()"></select>
            </div>
            <div class="input-group">
                <label for="hourlyRate">Paga Oraria Base (€)</label>
                <input type="number" id="hourlyRate" value="12" step="0.5" oninput="calculateAll()">
            </div>
            <div class="input-group">
                <label for="standardHours">Ore Std / Giorno</label>
                <input type="number" id="standardHours" value="8" step="0.5" oninput="calculateAll()">
            </div>
            <div class="input-group">
                <label for="weekdayOvertimeRate">Extra Feriale (€/h)</label>
                <input type="number" id="weekdayOvertimeRate" value="15.60" step="0.5" oninput="calculateAll()">
            </div>
            <div class="input-group">
                <label for="weekendOvertimeRate">Extra Festivo/Sab/Dom (€/h)</label>
                <input type="number" id="weekendOvertimeRate" value="18.00" step="0.5" oninput="calculateAll()">
            </div>
            <div class="input-group">
                <label for="forfaitThreshold">Forfait Mensile (Ore)</label>
                <input type="number" id="forfaitThreshold" value="20" step="1" oninput="calculateAll()">
            </div>
        </div>
    </div>

    <div class="actions-bar">
        <button class="btn-small" onclick="toggleAllMonths(true)">Apri Tutti i Mesi</button>
        <button class="btn-small" onclick="toggleAllMonths(false)">Chiudi Tutti</button>
    </div>

    <!-- LISTA MESI A QUADRETTI -->
    <div class="year-container" id="yearContainer">
        <!-- Generato via JavaScript -->
    </div>

    <!-- RIEPILOGO TOTALE ANNUALE -->
    <div class="summary-box">
        <div class="summary-row">
            <span>Totale Ore Ordinarie Annue:</span>
            <span id="yearStdHours">0 h</span>
        </div>
        <div class="summary-row">
            <span>Totale Ore Extra Annue (Accumulate):</span>
            <span id="yearExtHours" style="color: var(--warning-color);">0 h</span>
        </div>
        <div class="summary-row">
            <span>Ore Extra Pagate Oltre Forfait:</span>
            <span id="yearPaidExtHours" style="color: var(--danger-color);">0 h</span>
        </div>
        <div class="summary-row">
            <span>Compenso Base Annuo:</span>
            <span id="yearBasePay">0.00 €</span>
        </div>
        <div class="summary-row">
            <span>Compenso Straordinari Pagati Annuo:</span>
            <span id="yearExtPay" style="color: var(--success-color);">+0.00 €</span>
        </div>
        <div class="summary-row total">
            <span>Totale Guadagno Annuo:</span>
            <span id="yearGrandTotal">0.00 €</span>
        </div>
    </div>
</div>

<script>
    const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
    const weekDaysShort = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];

    const yearSelect = document.getElementById('yearSelect');

    function initYearSelector() {
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 2; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }
    }

    function buildYearGrid() {
        const year = parseInt(yearSelect.value);
        const container = document.getElementById('yearContainer');
        container.innerHTML = '';

        monthNames.forEach((mName, mIndex) => {
            const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
            // Trova il primo giorno della settimana (0 = Dom, 1 = Lun, ecc.)
            let firstDayOfWeek = new Date(year, mIndex, 1).getDay();
            // Converti in formato Lunedì=0, Domenica=6
            firstDayOfWeek = (firstDayOfWeek === 0) ? 6 : firstDayOfWeek - 1;

            const savedData = loadSavedData(year, mIndex);

            const card = document.createElement('div');
            card.className = 'month-card';
            card.id = `month-card-${mIndex}`;

            // Intestazione Giorni Settimana per la griglia
            let calendarHTML = `<div class="calendar-weekdays">`;
            weekDaysShort.forEach(d => calendarHTML += `<div>${d}</div>`);
            calendarHTML += `</div><div class="calendar-grid">`;

            // Quadretti vuoti prima del 1° del mese
            for (let e = 0; e < firstDayOfWeek; e++) {
                calendarHTML += `<div class="calendar-day empty"></div>`;
            }

            // Quadretti reali dei giorni
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, mIndex, d);
                const dayOfWeek = dateObj.getDay(); // 0 = Dom, 6 = Sab
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const savedVal = savedData[d] !== undefined ? savedData[d] : '';

                calendarHTML += `
                    <div class="calendar-day ${isWeekend ? 'weekend' : ''}" id="cell-m${mIndex}-d${d}">
                        <span class="day-num">${d}</span>
                        <div class="day-input-box">
                            <input type="number" class="day-input" id="m-${mIndex}-d-${d}" value="${savedVal}" min="0" max="24" step="0.5" oninput="calculateAll()">
                        </div>
                        <span class="day-tag" id="tag-m${mIndex}-d${d}">-</span>
                    </div>
                `;
            }

            calendarHTML += `</div>`;

            card.innerHTML = `
                <div class="month-header" onclick="toggleMonth(${mIndex})">
                    <div class="month-title">
                        <span>${mName}</span>
                        <span class="month-badge" id="badge-total-${mIndex}">0.00 €</span>
                    </div>
                    <span id="arrow-${mIndex}">▼</span>
                </div>
                <div class="month-body">
                    <div style="margin-bottom:12px; display:flex; gap:10px;">
                        <button class="btn-small" onclick="fillMonthWorkdays(${mIndex})">Compila Lun-Ven (Std)</button>
                        <button class="btn-small" onclick="clearMonth(${mIndex})">Azzera Mese</button>
                    </div>
                    ${calendarHTML}
                </div>
            `;

            container.appendChild(card);
        });

        calculateAll();
    }

    function toggleMonth(mIndex) {
        const card = document.getElementById(`month-card-${mIndex}`);
        const arrow = document.getElementById(`arrow-${mIndex}`);
        card.classList.toggle('open');
        arrow.innerText = card.classList.contains('open') ? '▲' : '▼';
    }

    function toggleAllMonths(open) {
        monthNames.forEach((_, mIndex) => {
            const card = document.getElementById(`month-card-${mIndex}`);
            const arrow = document.getElementById(`arrow-${mIndex}`);
            if (open) {
                card.classList.add('open');
                arrow.innerText = '▲';
            } else {
                card.classList.remove('open');
                arrow.innerText = '▼';
            }
        });
    }

    function calculateAll() {
        const year = parseInt(yearSelect.value);
        const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const standardLimit = parseFloat(document.getElementById('standardHours').value) || 0;
        const weekdayOvertimeRate = parseFloat(document.getElementById('weekdayOvertimeRate').value) || 0;
        const weekendOvertimeRate = parseFloat(document.getElementById('weekendOvertimeRate').value) || 0;
        const forfaitThreshold = parseFloat(document.getElementById('forfaitThreshold').value) || 0;

        let yearStdHrs = 0;
        let yearExtHrs = 0;
        let yearPaidExtHrs = 0;
        let yearBasePay = 0;
        let yearExtPay = 0;

        monthNames.forEach((_, mIndex) => {
            const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
            let monthStdHrs = 0;
            let monthExtHrs = 0;
            const monthState = {};

            // Lista per tracciare ogni singola ora extra del mese ed applicare la regola forfait
            const overtimeEntries = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const input = document.getElementById(`m-${mIndex}-d-${d}`);
                if (!input) continue;

                const hours = parseFloat(input.value) || 0;
                monthState[d] = input.value;

                const dateObj = new Date(year, mIndex, d);
                const dayOfWeek = dateObj.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                if (hours > 0) {
                    if (hours > standardLimit) {
                        const std = standardLimit;
                        const ext = hours - standardLimit;
                        monthStdHrs += std;
                        monthExtHrs += ext;

                        overtimeEntries.push({
                            day: d,
                            hours: ext,
                            isWeekend: isWeekend
                        });
                    } else {
                        monthStdHrs += hours;
                        updateDayTag(mIndex, d, "OK", "var(--text-muted)");
                    }
                } else {
                    updateDayTag(mIndex, d, "-", "var(--text-muted)");
                }
            }

            // Calcolo Straordinari del mese considerando il Forfait
            let accumulatedOvertime = 0;
            let monthPaidExtPay = 0;
            let monthPaidExtHrs = 0;

            overtimeEntries.forEach(entry => {
                let paidHoursInThisEntry = 0;
                let forfaitHoursInThisEntry = 0;

                for (let h = 0; h < entry.hours; h += 0.5) {
                    accumulatedOvertime += 0.5;
                    if (accumulatedOvertime > forfaitThreshold) {
                        paidHoursInThisEntry += 0.5;
                    } else {
                        forfaitHoursInThisEntry += 0.5;
                    }
                }

                monthPaidExtHrs += paidHoursInThisEntry;
                const rate = entry.isWeekend ? weekendOvertimeRate : weekdayOvertimeRate;
                monthPaidExtPay += (paidHoursInThisEntry * rate);

                // Aggiorna l'etichetta del giorno
                if (paidHoursInThisEntry > 0) {
                    updateDayTag(mIndex, entry.day, `+${entry.hours}h (€)`, "var(--danger-color)");
                } else {
                    updateDayTag(mIndex, entry.day, `+${entry.hours}h (Forfait)`, "var(--warning-color)");
                }
            });

            const monthBasePay = monthStdHrs * hourlyRate;
            const monthTotalPay = monthBasePay + monthPaidExtPay;

            document.getElementById(`badge-total-${mIndex}`).innerText = `${monthStdHrs + monthExtHrs}h | ${monthTotalPay.toFixed(2)} €`;

            yearStdHrs += monthStdHrs;
            yearExtHrs += monthExtHrs;
            yearPaidExtHrs += monthPaidExtHrs;
            yearBasePay += monthBasePay;
            yearExtPay += monthPaidExtPay;

            saveData(year, mIndex, monthState);
        });

        const yearGrandTotal = yearBasePay + yearExtPay;

        document.getElementById('yearStdHours').innerText = `${yearStdHrs.toFixed(1)} h`;
        document.getElementById('yearExtHours').innerText = `${yearExtHrs.toFixed(1)} h`;
        document.getElementById('yearPaidExtHours').innerText = `${yearPaidExtHrs.toFixed(1)} h`;
        document.getElementById('yearBasePay').innerText = `${yearBasePay.toFixed(2)} €`;
        document.getElementById('yearExtPay').innerText = `+${yearExtPay.toFixed(2)} €`;
        document.getElementById('yearGrandTotal').innerText = `${yearGrandTotal.toFixed(2)} €`;
    }

    function updateDayTag(mIndex, day, text, color) {
        const tag = document.getElementById(`tag-m${mIndex}-d${day}`);
        if (tag) {
            tag.innerText = text;
            tag.style.color = color;
        }
    }

    function fillMonthWorkdays(mIndex) {
        const year = parseInt(yearSelect.value);
        const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
        const stdHours = document.getElementById('standardHours').value || 8;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, mIndex, d);
            const dayOfWeek = dateObj.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                const input = document.getElementById(`m-${mIndex}-d-${d}`);
                if (input) input.value = stdHours;
            }
        }
        calculateAll();
    }

    function clearMonth(mIndex) {
        const year = parseInt(yearSelect.value);
        const daysInMonth = new Date(year, mIndex + 1, 0).getDate();

        for (let d = 1; d <= daysInMonth; d++) {
            const input = document.getElementById(`m-${mIndex}-d-${d}`);
            if (input) input.value = '';
        }
        calculateAll();
    }

    function saveData(year, month, data) {
        const key = `work_hours_${year}_${month}`;
        localStorage.setItem(key, JSON.stringify(data));
    }

    function loadSavedData(year, month) {
        const key = `work_hours_${year}_${month}`;
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : {};
    }

    initYearSelector();
    buildYearGrid();
</script>

</body>
</html>
