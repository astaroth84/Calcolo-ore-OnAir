    <style>
        :root {
            --bg-color: #060911;
            --card-bg: rgba(15, 23, 42, 0.7);
            --accent-color: #38bdf8;

            --purple-color: #e081f9;
            --purple-glow: rgba(224, 129, 249, 0.45);
            --saturday-color: #f59e0b;
            --saturday-glow: rgba(245, 158, 11, 0.4);
            --text-color: #f8fafc;
            --text-muted: #64748b;
            --border-color: rgba(51, 65, 85, 0.6);
            --border-glow: rgba(56, 189, 248, 0.2);
            --danger-color: #fb7185;
            --success-color: #34d399;
            --warning-color: #fbbf24;
            --night-color: #c084fc;
            --day-bg: rgba(15, 23, 42, 0.65);
            --saturday-bg: rgba(245, 158, 11, 0.12);
            --sunday-bg: rgba(224, 129, 249, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 129, 249, 0.08) 0px, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 9, 17, 0.95);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 30px var(--accent-glow);
            border-radius: 24px;
            padding: 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .login-card h2 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 22px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            background: rgba(6, 9, 17, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .login-card input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-color), #0284c7);
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .container {
            display: none;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 1px rgba(255,255,255,0.1);
            padding: 16px;
            width: 100%;
            max-width: 1050px;
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(16px);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-onair {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: #000000;
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 12px rgba(0,0,0,0.8);
            user-select: none;
        }

        .logo-onair .text-onair {
            color: #ffffff;
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .logo-onair .text-onair span {
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .logo-onair .text-multimedia {
            color: var(--text-muted);
            font-size: 0.55rem;
            letter-spacing: 2.5px;
            text-transform: lowercase;
            margin-top: 2px;
            font-weight: 600;
        }

        .title-box h1 {
            font-size: 1.15rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .title-box .subtitle-name {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .tabs-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: rgba(11, 19, 41, 0.8);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(2, 132, 197, 0.15));
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .master-panel {
            background: rgba(6, 9, 17, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
        }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
